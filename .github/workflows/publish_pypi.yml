name: PyPi wheel generation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build external data bundle
        run: python scripts/build_data_bundle.py --out dist --check-catalog
      - name: Check distribution size
        run: python scripts/check_distribution_size.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-data
          path: |
            dist/symbolica_fonts-*.whl
            dist/symbolica_vakint_data-*.whl
  linux:
    runs-on: ${{ matrix.runner[0] }}
    strategy:
      fail-fast: false
      matrix:
        runner: [[ubuntu-24.04, x86_64]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        with:
          target: ${{ matrix.runner[1] }}
          args: --release --compression-level 9 --out dist --sdist
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.runner[1] }}
          path: dist
  macos:
    runs-on: ${{ matrix.runner[0] }}
    strategy:
      fail-fast: false
      matrix:
        runner: [[macos-15-intel, x86_64], [macos-14, aarch64]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install LLVM Mach-O linker
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        with:
          target: ${{ matrix.runner[1] }}
          args: --release --compression-level 9 --out dist
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.runner[1] }}
          path: dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          # gmp-mpfr-sys 1.7.1 documents MINGW64; validate UCRT64 separately.
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          path-type: inherit
          install: >-
            git
            ca-certificates
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-make
            m4

      - name: Build and Repair wheels
        shell: msys2 {0}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          RUSTFLOW_WORKSPACE_FEATURES: pyo3/extension-module
          RUSTFLOW_WORKSPACE_NO_DEFAULT_FEATURES: "0"
        run: |
          pip install maturin delvewheel
          maturin build --release --compression-level 9 --out dist
          delvewheel repair dist/*.whl --wheel-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: wheelhouse

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [data, linux, macos, windows]
    if: inputs.publish == true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Check core citation stub in source and wheels
        run: python .github/scripts/check_core_stub.py python/symbolica/core.pyi dist/symbolica-*.whl

      - name: Check distribution sizes
        run: python scripts/check_distribution_size.py dist/*

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*
